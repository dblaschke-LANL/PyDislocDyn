name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.toml'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - {compiler: gcc, version: 'latest'}
          - {compiler: intel, version: '2025.0'}
          - {compiler: intel, version: '2025.3'}
          #~ - {compiler: nvidia-hpc, version: 'latest'}
          #~ - {compiler: lfortran, version: '0.66.0'}
          #~ - {compiler: aocc, version: '5.1.0'}
        exclude:
          #~ - os: macos-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: macos-latest
            #~ toolchain: {compiler: aocc}
          - os: macos-latest
            toolchain: {compiler: intel}
          #~ - os: windows-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: windows-latest
            #~ toolchain: {compiler: aocc}
    steps:
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
        if: runner.os != 'MacOS'
      - uses: actions/checkout@v7
      - name: Setup Fortran Compiler MacOS
        uses: fortran-lang/setup-fortran@v1
        if: runner.os == 'MacOS'
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Run tests Linux
        run: |
          fpm test --profile release --compiler ${{ env.FC }} 
          FC=${{ env.FC }} make
          ./runtests.x
        if: runner.os  == 'Linux'
      - name: Run tests MacOS
        run: |
          FC=${{ env.FC }} make
          ./runtests.x
          fpm test --profile release
        if: runner.os  == 'MacOS'
      - name: Run tests windows
        run: |
          fpm test --profile release --compiler ${{ env.FC }} 
