name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.toml'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
        toolchain:
          #~ - {compiler: gcc, version: '10'}
          - {compiler: gcc, version: '15'}
          - {compiler: gcc, version: '16'}
          - {compiler: intel, version: '2025.0'}
          - {compiler: intel, version: 'latest'}
          #~ - {compiler: nvidia-hpc, version: 'latest'} # does not support 'select rank'
          - {compiler: lfortran, version: '0.68.0'}
          - {compiler: lfortran, version: '0.69.0'}
          - {compiler: flang, version: '22'}
          - {compiler: flang, version: '23'}
          #~ - {compiler: aocc, version: 'latest'} # does not support fortran 2018
        exclude:
          #~ - os: macos-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: macos-latest
            #~ toolchain: {compiler: aocc}
          - os: macos-latest
            toolchain: {compiler: intel}
          - os: macos-latest
            toolchain: {compiler: flang}
          #~ - os: macos-latest
            #~ toolchain: {compiler: gcc, version: '10'}
          - os: windows-latest
            toolchain: {compiler: intel}
          - os: windows-latest
            toolchain: {compiler: flang}
          #~ - os: windows-latest
            #~ toolchain: {compiler: nvidia-hpc}
          #~ - os: windows-latest
            #~ toolchain: {compiler: aocc}
          - os: windows-latest
            toolchain: {compiler: lfortran} # broken on windows runner
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v1
        id: setup-fortran
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v11
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fpm-version: 'current'
      - name: Run tests fpm
        run: |
          fpm --version
          fpm test --profile release --compiler ${{ env.FC }} 
        if: runner.os  != 'MacOS' && matrix.toolchain.compiler != 'lfortran'
      - name: Run tests MAKE
        run: |
          ${{ env.FC }}  --version
          FC=${{ env.FC }} make -j
          ./runtests.x
        if: runner.os  != 'Windows'
