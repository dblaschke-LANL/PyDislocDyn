name: CI

on:
  push:
    paths:
      - '**.f90'
      - '**.toml'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-latest, macos-latest, windows-latest]
        toolchain:
          - {compiler: gfortran, version: '11'}
          - {compiler: gfortran, version: 'latest'}
          - {compiler: ifx, version: '2024.1'}
          - {compiler: ifx, version: 'latest'}
          #~ - {compiler: nvfortran, version: 'latest'} # does not support 'select rank'
          - {compiler: lfortran, version: '0.68.0'}
          - {compiler: lfortran, version: '0.69.0'}
          - {compiler: flang, version: '22'}
          - {compiler: flang, version: 'latest'}
          - {compiler: aocc, version: 'latest'} # <6.0 does not support fortran 2018, aof 6.0 not supported by fpm (yet)
        exclude:
          - os: ubuntu-24.04
            toolchain: {compiler: flang}
          - os: ubuntu-24.04
            toolchain: {compiler: gfortran}
          - os: ubuntu-24.04
            toolchain: {compiler: ifx, version: 'latest'}
          - os: ubuntu-24.04
            toolchain: {compiler: aocc}
          - os: ubuntu-24.04
            toolchain: {compiler: lfortran}
          - os: ubuntu-latest
            toolchain: {compiler: ifx, version: '2024.1'}
          - os: macos-latest
            toolchain: {compiler: flang} # callback fct not supported on MacOS up to 23 (21 missing omp, 22 not supported by action)
          - os: macos-latest
            toolchain: {compiler: gfortran, version: '11'}
          - os: macos-latest
            toolchain: {compiler: aocc}
          - os: macos-latest
            toolchain: {compiler: ifx}
          - os: windows-latest
            toolchain: {compiler: ifx}
          - os: windows-latest
            toolchain: {compiler: flang} # linking fails with shared lib, fpm issue?
          - os: windows-latest
            toolchain: {compiler: aocc}
          - os: windows-latest
            toolchain: {compiler: lfortran} # broken on windows runner
    steps:
      - uses: actions/checkout@v7
      - uses: fortran-lang/setup-fortran@v2.0.0-beta.17
        id: setup-fortran
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          compiler: ${{ matrix.toolchain.compiler }}
          version: ${{ matrix.toolchain.version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v12
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          #~ fpm-version: 'current'
      - name: Run tests fpm
        run: |
          fpm --version
          ${{ env.FC }}  --version
          fpm test --profile release --compiler ${{ env.FC }}
        if: matrix.toolchain.compiler != 'aocc'
      - name: Run tests MAKE
        run: |
          if [[ "${{matrix.toolchain.compiler}}" == "aocc" ]]; then
            aof  --version
            FC='aof' make -j
          else
            ${{matrix.toolchain.compiler}}  --version
            FC=${{matrix.toolchain.compiler}} make -j
          fi
          ./runtests.x
          # try out a workaround for fpm:
          if [[ "${{matrix.toolchain.compiler}}" == "aocc" ]]; then
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(which aof)" "$HOME/.local/bin/flang"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "FPM_FC=flang" >> "$GITHUB_ENV"
            flang --version
            fpm test --profile release --compiler flang --link-flag "-Wl,-z,execstack"
          fi
        if: runner.os  != 'Windows'
