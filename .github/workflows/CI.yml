name: CI

on:
  push:
    paths:
      - '**.py'
      - '**.f90'
      - '**.toml'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.14"]
        toolchain:
          - {compiler: gcc, version: 'latest'}
        exclude:
          - os: macos-latest
            python-version: '3.10'
          - os: windows-latest
            python-version: '3.10'
        include:
          - python-version: '3.10'
            module-versions: "numpy==1.26 scipy==1.10 sympy==1.12 matplotlib==3.8 pandas==1.5 jinja2==3.0.3 joblib==1.1 threadpoolctl==3.3 gmpy2==2.2.1 numba==0.58.1 tomli==2.0 meson ninja pytest==9.0.1"
          - python-version: '3.14'
            module-versions: "numpy scipy sympy matplotlib pandas jinja2 joblib threadpoolctl gmpy2 numba meson ninja pytest pytest-xdist"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Fortran Compiler
        uses: fortran-lang/setup-fortran@v1
        if: runner.os == 'MacOS'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: runner.os  == 'Linux'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.module-versions }}
          pip install .
      - name: Run tests Linux
        run: |
          fpm test --profile release
          make
          ./runtests.x
          yes 2>/dev/null | pytest -s --durations=0 testing/
        if: runner.os  == 'Linux'
      - name: Run tests MacOS
        run: |
          make
          ./runtests.x
          yes 2>/dev/null | pytest -s --durations=0 testing/
        if: runner.os  == 'MacOS'
      - name: Run tests windows
        run: |
          echo 'N' | pytest -s --collect-only testing
          pytest -n auto -rP --durations=0 testing/
        if: runner.os == 'Windows'
      - name: Upload log files as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: test-logfiles_${{runner.os}}_${{matrix.python-version}}
          path: |
            regressiontests/poly.log
            regressiontests/dragiso.log
            regressiontests/drag/dragsemi.log
            regressiontests/LT_exp/LT.log

