name: CI

on:
  push:
    paths:
      - '**.py'
      - '**.f90'
      - '**.toml'
      - '**.yml'

jobs:
  RunTests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.14"]
        toolchain:
          - {compiler: gcc, version: 'latest'}
        exclude:
          - os: macos-latest
            python-version: '3.11'
          - os: windows-latest
            python-version: '3.11'
        include:
          - python-version: '3.11'
            module-versions: "numpy==2.2 scipy==1.13 sympy==1.13 matplotlib==3.9 pandas==2.2 jinja2==3.1 joblib==1.2 threadpoolctl==3.1 gmpy2==2.2.1 numba==0.61 meson ninja pytest==8.3"
          - python-version: '3.14'
            module-versions: "numpy scipy sympy matplotlib pandas jinja2 joblib threadpoolctl gmpy2 numba pyyaml meson ninja pytest pytest-xdist"
    steps:
      - uses: actions/checkout@v7
      - name: Setup Fortran Compiler
        uses: fortran-lang/setup-fortran@v1
        if: runner.os == 'MacOS' || runner.os == 'Windows'
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup Fortran Package Manager
        uses: fortran-lang/setup-fpm@v10
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        if: runner.os  == 'Linux' || runner.os == 'Windows'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ${{ matrix.module-versions }}
          pip install .
      - name: Run tests Linux
        run: |
          fpm test --profile release
          make
          ./runtests.x
          yes 2>/dev/null | pytest -s --durations=0 testing/
        if: runner.os  == 'Linux'
      - name: Run tests MacOS
        run: |
          make
          ./runtests.x
          yes 2>/dev/null | pytest -s --durations=0 testing/
        if: runner.os  == 'MacOS'
      - name: Run tests windows
        run: |
          fpm test --profile release
          echo 'N' | pytest -s --collect-only testing
          pytest -n auto -rP --durations=0 testing/
        if: runner.os == 'Windows'
      #~ - name: Upload log files as artifacts
        #~ uses: actions/upload-artifact@v7
        #~ with:
          #~ name: test-logfiles_${{runner.os}}_${{matrix.python-version}}
          #~ path: |
            #~ regressiontests/poly.log
            #~ regressiontests/dragiso.log
            #~ regressiontests/drag/dragsemi.log
            #~ regressiontests/LT_exp/LT.log

