# input parameters for alpha-Quartz at ambient conditions
name = "Quartz"
sym = "trig"
#burgers = "4.9136e-10"
T = "300"
rho = "2648."

[lattice]
a = "4.9136e-10"
c = "5.4051e-10"

[soec]
# need 6 constants for trigonal: c11, c12, c13, c14, c33, c44, taken from the CRC handbook
cij = "8.680e+10, 0.704e+10, 1.191e+10, -1.804e+10, 10.575e+10, 5.820e+10"

[toec]
cijk = "-2.10e+11,-3.45e+11,0.12e+11,-1.63e+11,-2.94e+11,-0.15e+11,-3.12e+11,0.02e+11,-1.34e+11,-2.e+11,-3.32e+11,-8.15e+11,-1.10e+11,-2.76e+11"

[slip]
# example (basal) slip system, see https://doi.org/10.1016/j.jsg.2024.105106
Millerb = "2/3, -1/3, -1/3, 0"
Millern0 = "0, 0, 0, 1"
